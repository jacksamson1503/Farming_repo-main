<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d07">
  <meta name="description" content="Smart Farm Assistant - Bilingual agriculture companion for Indian farmers with live weather, crop guidance, soil testing, market prices, and government schemes.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Smart Farm Assistant - Control Every Field with Ease</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root">
    <div style="padding:80px 20px;text-align:center;color:#829a80;font-family:'Plus Jakarta Sans',sans-serif">
      <div style="font-size:40px;margin-bottom:14px;">🌱</div>
      <h3 style="color:#ffffff;margin-bottom:8px;font-size:20px;font-weight:800;">Smart Farm Assistant</h3>
      <p style="color:#34d399;font-size:14px;font-weight:600;">உழவன் தோழன் ஏற்றப்படுகிறது...</p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('SW registration skipped:', err);
        });
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
